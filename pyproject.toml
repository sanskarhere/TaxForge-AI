[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tax-synth"
version = "0.1.0"
description = "Synthetic US tax dataset generator with PDF output"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Sanskar Gupta" }
]
dependencies = [
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "faker>=40.0.0",
  "jinja2>=3.1.0",
  "pypdf>=6.9.0",
  "typer>=0.16.0",
  "rich>=14.0.0",
  "python-dotenv>=1.1.0",
  "orjson>=3.10.0",
  "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
  "mypy>=1.15.0",
]

[project.scripts]
tax-synth = "tax_synth.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []